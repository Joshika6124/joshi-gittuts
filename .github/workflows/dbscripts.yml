name: Archive SQL Files with Timestamp

# -----------------------------------------------------------------------------
# What this does:
# 1. Triggers on pushes that touch a .sql file under SOURCE_DIR.
# 2. Diffs the push (before-commit -> after-commit) to find ONLY the .sql
#    files that were actually added or changed in that push - not every
#    file in the folder.
# 3. Creates a new timestamped folder inside ARCHIVE_DIR
#    (e.g. sql-archive/20260923_2-59-PM/).
# 4. Copies just those changed .sql files into that timestamped folder,
#    preserving their original subfolder path, using PowerShell.
# 5. Commits and pushes the new timestamped folder back to the repo.
#
# Adjust SOURCE_DIR / ARCHIVE_DIR below to match your repo layout.
# Runs on the self-hosted Windows runner using Windows PowerShell
# (powershell.exe), matching deploy.yml.
# -----------------------------------------------------------------------------

on:
  push:
    branches: [ master ]
    paths:
      - 'DBscripts/**/*.sql'
  workflow_dispatch: {}   # allows manual runs from the Actions tab

env:
  SOURCE_DIR: DBscripts                          # folder where your .sql files live
  ARCHIVE_DIR: DB scripts archive/sql archive     # parent folder that will hold timestamped copies

permissions:
  contents: write   # required so GITHUB_TOKEN can push the archived files back

jobs:
  archive-sql:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate timestamp
        id: ts
        run: |
          # Colons aren't valid in folder/file names on Windows or in Git,
          # so "2:59 PM" becomes "2-59-PM" (dash instead of colon).
          # Uses the runner's LOCAL time (not UTC), since this is a
          # self-hosted machine and folder names should match your clock.
          $stamp = (Get-Date).ToString("yyyyMMdd_h-mm-tt")
          "stamp=$stamp" >> $env:GITHUB_OUTPUT

      - name: Copy SQL files preserving folder structure
        env:
          STAMP: ${{ steps.ts.outputs.stamp }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = "Stop"

          $src  = $env:SOURCE_DIR
          $dest = Join-Path $env:ARCHIVE_DIR $env:STAMP

          if (-not (Test-Path $src)) {
              Write-Host "Source directory '$src' does not exist. Nothing to archive."
              exit 0
          }

          $before = $env:BEFORE_SHA
          $after  = $env:AFTER_SHA
          $allZero = "0000000000000000000000000000000000000000"

          # Figure out which .sql files were actually added/changed in this push.
          # Manual runs (workflow_dispatch) have no "before" commit, so fall back
          # to the files changed in the single most recent commit instead.
          if ([string]::IsNullOrWhiteSpace($before) -or $before -eq $allZero) {
              Write-Host "No previous commit to diff against - using the latest commit only."
              $changed = git diff --name-only --diff-filter=ACMR "HEAD~1" "HEAD" -- "$src/**/*.sql" 2>$null
              if (-not $changed) {
                  # First-ever commit in the repo: nothing to diff against at all.
                  $changed = git show --name-only --diff-filter=ACMR --pretty=format: "HEAD" -- "$src/**/*.sql"
              }
          } else {
              $changed = git diff --name-only --diff-filter=ACMR $before $after -- "$src/**/*.sql"
          }

          $changed = @($changed | Where-Object { $_ -and (Test-Path $_) })

          if ($changed.Count -eq 0) {
              Write-Host "No new or changed .sql files in this push. Nothing to archive."
              exit 0
          }

          New-Item -ItemType Directory -Path $dest -Force | Out-Null

          $srcFull = (Resolve-Path $src).Path

          foreach ($relPath in $changed) {
              $file = Get-Item -Path $relPath

              # Relative path with respect to the source folder,
              # e.g. Tables\Orders.sql
              $relativePath = $file.FullName.Substring($srcFull.Length).TrimStart('\','/')

              $destFilePath = Join-Path $dest $relativePath
              $destFileDir  = Split-Path $destFilePath -Parent

              New-Item -ItemType Directory -Path $destFileDir -Force | Out-Null
              Copy-Item -Path $file.FullName -Destination $destFilePath -Force
          }

          Write-Host "Copied $($changed.Count) new/changed SQL file(s) into: $dest"
          $changed | ForEach-Object { Write-Host " - $_" }

      - name: Commit and push timestamped archive
        env:
          STAMP: ${{ steps.ts.outputs.stamp }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          $archivePath = Join-Path $env:ARCHIVE_DIR $env:STAMP
          git add $archivePath

          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
              Write-Host "No changes to commit."
          } else {
              git commit -m "Archive SQL files -> $archivePath"
              git push
          }
